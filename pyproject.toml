[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ads-operator"
version = "0.1.0"
description = "A local, safety-first CLI for planning and operating Meta ads."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Meta Ads Operator contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
release = [
  "build>=1.2",
  "detect-secrets>=1.5",
  "PyYAML>=6",
]

[project.scripts]
meta-ads = "meta_ads_operator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
